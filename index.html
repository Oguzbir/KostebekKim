<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Köstebek">
<meta name="theme-color" content="#1b1530">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Köstebek Kim?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one card in the middle of a dark felt table; one screen per step */
:root{
  --bg:#1b1530; --felt:#251d42; --card:#fdf6e3; --ink:#1b1530;
  --fg:#f1ecff; --muted:#a79ccc; --gold:#ffc83d; --red:#ff5a5f; --line:#3a2f62;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.app{max-width:560px;margin:0 auto;padding-block:20px 32px;min-height:100%;display:flex;flex-direction:column;gap:20px;box-sizing:border-box}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--red)}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{color:var(--muted);margin:6px 0 0;line-height:1.5}
section{display:flex;flex-direction:column;gap:10px}
.names{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row .n{width:28px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--felt);color:var(--fg);outline:none;-webkit-user-select:text;user-select:text}
input[type=text]:focus{border-color:var(--gold)}
.x{width:44px;height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--muted);font-size:22px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:16px;padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.chip:disabled{opacity:.35}
.btn{font-family:var(--display);font-weight:600;font-size:18px;padding:18px 20px;border-radius:16px;border:0;background:var(--gold);color:var(--ink);cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.small{align-self:center;font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.small:not(:disabled){color:var(--fg);border-color:var(--muted)}
.small:disabled{opacity:.4}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.err{color:var(--red);min-height:1.3em;margin:0}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.card{background:var(--card);color:var(--ink);border-radius:24px;padding:32px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 18px 50px rgba(0,0,0,.45);min-height:300px;justify-content:center;box-sizing:border-box}
.card .who{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,46px);word-break:break-word}
.card .lbl{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#6c5f8f;font-weight:700}
.card .word{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,52px);line-height:1.1;word-break:break-word}
.card.imp{background:var(--red);color:#fff}
.card.imp .lbl{color:#ffe1e2}
.cat{display:inline-block;padding:6px 12px;border-radius:999px;background:rgba(27,21,48,.08);font-weight:500;font-size:15px}
.card.imp .cat{background:rgba(255,255,255,.18)}
.hold{touch-action:none;cursor:pointer;min-height:360px}
.hold.idle{background:var(--felt);color:var(--fg);border:3px dashed var(--muted);box-shadow:none}
.hold.idle .lbl{color:var(--muted)}
.finger{font-size:56px;line-height:1}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--gold)}
.dot.now{background:var(--fg)}
.round{font-family:var(--display);font-weight:600;text-align:center;color:var(--muted);letter-spacing:.06em}
.order{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0;padding:0;list-style:none}
.order li{padding:6px 10px;border-radius:999px;background:var(--felt);color:var(--muted);font-size:15px}
.order li.now{background:var(--gold);color:var(--ink);font-weight:700}
.votes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.vote{font:inherit;font-size:17px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--felt);color:var(--fg);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.vote b{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--gold)}
.vote.top{border-color:var(--gold)}
.res li{display:flex;justify-content:space-between;padding:10px 14px;border-radius:12px;background:var(--felt)}
.res{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.res li.bad{background:var(--red);color:#fff;font-weight:700}
.verdict{font-family:var(--display);font-weight:800;font-size:22px;text-align:center;margin:0;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:10px}
.rules{margin:0;padding-left:20px;color:var(--muted);line-height:1.55}
@media (prefers-reduced-motion:no-preference){.card{animation:pop .2s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}}
</style>

</head>
<body>
<div class="app" id="app"></div>

<script>
const DATA = {
  "Ünlüler": [
    ["Tarkan","şarkıcı"],["Sezen Aksu","şarkıcı"],["Barış Manço","müzisyen"],["Ajda Pekkan","şarkıcı"],["Zeki Müren","sanatçı"],
    ["Müslüm Gürses","şarkıcı"],["Cem Yılmaz","komedyen"],["Kemal Sunal","oyuncu"],["Şener Şen","oyuncu"],["Haluk Bilginer","oyuncu"],
    ["Arda Güler","futbolcu"],["Hakan Şükür","futbolcu"],["Naim Süleymanoğlu","sporcu"],["Orhan Pamuk","yazar"],["Nazım Hikmet","şair"],
    ["Nasreddin Hoca","hikâye kahramanı"],["Fatih Sultan Mehmet","padişah"],["Messi","futbolcu"],["Michael Jackson","şarkıcı"],["Einstein","bilim insanı"],
    ["Shakespeare","yazar"],["Leonardo da Vinci","ressam"],["Charlie Chaplin","oyuncu"],["Elon Musk","iş insanı"],["Mozart","besteci"]
  ],
  "Meslekler": [
    ["Doktor","hastane"],["Öğretmen","okul"],["Aşçı","mutfak"],["Pilot","gökyüzü"],["Polis","güvenlik"],["İtfaiyeci","acil durum"],
    ["Berber","saç"],["Dişçi","ağız"],["Avukat","mahkeme"],["Fırıncı","sabah"],["Çiftçi","toprak"],["Garson","restoran"],
    ["Astronot","bilim"],["Kasap","dükkân"],["Taksici","araba"],["Postacı","kapı"],["Fotoğrafçı","görüntü"],["Balıkçı","su"],
    ["Hemşire","sağlık"],["Mimar","bina"],["Terzi","kıyafet"],["Simitçi","sokak"]
  ],
  "Mekanlar": [
    ["Hastane","bina"],["Havalimanı","yolculuk"],["Plaj","yaz"],["Sinema","eğlence"],["Kütüphane","sessizlik"],["Hamam","su"],
    ["Pazar","alışveriş"],["Okul","çocuklar"],["Lunapark","eğlence"],["Cami","bina"],["Stadyum","kalabalık"],["Kapalıçarşı","alışveriş"],
    ["Düğün salonu","kutlama"],["Berber dükkânı","dükkân"],["Hayvanat bahçesi","gezi"],["Metro","yolculuk"],["Kuaför","dükkân"],["Kamp alanı","doğa"],
    ["Uzay istasyonu","bilim"],["Galata Kulesi","İstanbul"],["Kapadokya","gezi"],["Eczane","dükkân"]
  ],
  "Eşyalar": [
    ["Sandalye","ev"],["Buzdolabı","ev"],["Diş fırçası","banyo"],["Şemsiye","hava"],["Çaydanlık","mutfak"],["Gözlük","yüz"],
    ["Makas","kesmek"],["Saat","zaman"],["Yastık","yatak"],["Anahtar","kapı"],["Kumanda","televizyon"],["Bavul","yolculuk"],
    ["Ayna","banyo"],["Cezve","mutfak"],["Tesbih","el"],["Nazar boncuğu","şans"],["Kalem","okul"],["Mum","ışık"],
    ["Ütü","kıyafet"],["Halı","ev"],["Bisiklet","spor"],["Süpürge","temizlik"]
  ],
  "Hayvanlar": [
    ["Kedi","ev"],["Köpek","ev"],["Fil","büyük"],["Zürafa","Afrika"],["Penguen","soğuk"],["Aslan","Afrika"],["Yunus","deniz"],
    ["Tavuk","çiftlik"],["İnek","çiftlik"],["Kartal","gökyüzü"],["Kaplumbağa","yavaş"],["Arı","çiçek"],["Timsah","su"],
    ["Maymun","orman"],["Baykuş","gece"],["Deve","çöl"],["Ahtapot","deniz"],["Tavşan","orman"]
  ],
  "Yiyecekler": [
    ["Lahmacun","fırın"],["Baklava","tatlı"],["Mantı","hamur"],["Döner","sokak"],["Simit","kahvaltı"],["Menemen","kahvaltı"],
    ["Pizza","İtalya"],["Sushi","Japonya"],["Künefe","tatlı"],["İskender","et"],["Kokoreç","sokak"],["Dondurma","yaz"],
    ["Karpuz","yaz"],["Çay","içecek"],["Türk kahvesi","içecek"],["Ayran","içecek"],["Hamburger","fast food"],["Sarma","yemek"],["Pide","fırın"],["Lokum","tatlı"]
  ]
};
const CATS = Object.keys(DATA);
const ROUNDS = 3;

let S = {
  names: load("imp_names", ["", "", ""]),
  impCount: load("imp_count", 1),
  hint: load("imp_hint", true),
  screen: "setup",
};
function load(k,d){try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick = a => a[Math.floor(Math.random()*a.length)];
const players = () => S.names.map(n=>n.trim()).filter(Boolean);
const maxImp = n => Math.max(1, Math.floor((n-1)/2));

function render(){
  ({setup:renderSetup, pass:renderPass, reveal:renderReveal, talk:renderTalk, vote:renderVote, end:renderEnd})[S.screen]();
  window.scrollTo(0,0);
}

function renderSetup(){
  const n = players().length;
  app.innerHTML = `
    <header><h1>Köstebek <span>Kim?</span></h1>
    <p class="sub">Herkes aynı gizli kelimeyi görür, köstebek sadece küçük bir ipucu. Sırayla kelimeye benzeyen bir şey söyleyin, köstebeği bulun.</p></header>
    <section><h2 id="cnt">Oyuncular (${n}/10)</h2>
      <p class="sub" style="margin:0">Masada oturduğunuz sırayla, saat yönünde yazın.</p>
      <div class="names">${S.names.map((v,i)=>`
        <div class="row"><span class="n">${i+1}</span>
        <input type="text" id="nm${i}" data-i="${i}" value="${esc(v)}" placeholder="İsim yaz" maxlength="18" autocomplete="off" enterkeyhint="next">
        ${S.names.length>3?`<button class="x" data-del="${i}" aria-label="Sil">×</button>`:""}</div>`).join("")}
      </div>
      ${S.names.length<10?`<button class="btn ghost" id="add">+ Oyuncu ekle</button>`:""}
    </section>
    <section><h2>Köstebek sayısı</h2>
      <div class="chips">${[1,2,3].map(k=>`<button class="chip" data-imp="${k}" aria-pressed="${S.impCount===k}" ${k>1&&k>maxImp(n)?"disabled":""}>${k}</button>`).join("")}</div>
    </section>
    <section><h2>Köstebeğe ipucu</h2>
      <div class="chips"><button class="chip" data-hint="1" aria-pressed="${S.hint}">İpucu ver</button><button class="chip" data-hint="0" aria-pressed="${!S.hint}">İpucu yok</button></div>
    </section>
    <section><h2>Kurallar</h2>
      <ol class="rules">
        <li>Telefon sırayla dolaşır, herkes kartı basılı tutarak kelimesini görür.</li>
        <li>${ROUNDS} tur boyunca saat yönünde herkes kelimeyle ilgili tek bir kelime söyler.</li>
        <li>Her oyunda bir sonraki kişi başlar.</li>
        <li>Turlar bitince oylama yapılır. En çok oyu alan köstebekse siz kazanırsınız.</li>
      </ol>
    </section>
    <p class="err" id="err"></p>
    <button class="btn" id="start">Oyunu başlat</button>`;

  app.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("input",e=>{S.names[+e.target.dataset.i]=e.target.value;save("imp_names",S.names);
      document.getElementById("cnt").textContent=`Oyuncular (${players().length}/10)`});
    inp.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const i=+e.target.dataset.i;
      if(i===S.names.length-1&&S.names.length<10){S.names.push("");render()}
      document.getElementById("nm"+(i+1))?.focus()});
    inp.addEventListener("blur",()=>renderChipsOnly());
  });
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.names.splice(+b.dataset.del,1);save("imp_names",S.names);render()});
  const add=document.getElementById("add"); if(add) add.onclick=()=>{S.names.push("");render();document.getElementById("nm"+(S.names.length-1)).focus()};
  app.querySelectorAll("[data-imp]").forEach(b=>b.onclick=()=>{S.impCount=+b.dataset.imp;save("imp_count",S.impCount);render()});
  app.querySelectorAll("[data-hint]").forEach(b=>b.onclick=()=>{S.hint=b.dataset.hint==="1";save("imp_hint",S.hint);render()});
  document.getElementById("start").onclick=startGame;
}
function renderChipsOnly(){
  const n=players().length;
  app.querySelectorAll("[data-imp]").forEach(b=>{const k=+b.dataset.imp;b.disabled=k>1&&k>maxImp(n)});
}

function startGame(){
  const p=players(), err=document.getElementById("err")||{};
  if(p.length<3){err.textContent="En az 3 oyuncu gerekli.";return}
  if(new Set(p.map(x=>x.toLocaleLowerCase("tr"))).size!==p.length){err.textContent="İki oyuncu aynı isimde. İsimleri farklı yazın.";return}
  const imps=Math.min(S.impCount,maxImp(p.length));
  const cat=pick(CATS);
  let recent=load("imp_recent",[]);
  let pool=DATA[cat].filter(w=>!recent.includes(w[0])); if(!pool.length) pool=DATA[cat];
  const [word,hint]=pick(pool);
  save("imp_recent",[word,...recent].slice(0,60));
  const idx=[...p.keys()].sort(()=>Math.random()-.5).slice(0,imps);
  // starter rotates one seat clockwise every game
  const game=load("imp_game",-1)+1; save("imp_game",game);
  const starter=game%p.length;
  S.game={players:p,cat,word,hint,imps:idx,turn:0,starter,step:0,votes:p.map(()=>0)};
  S.screen="pass"; render();
}

function dots(){const g=S.game;return `<div class="dots">${g.players.map((_,i)=>`<span class="dot ${i<g.turn?"done":i===g.turn?"now":""}"></span>`).join("")}</div>`}

function renderPass(){
  const g=S.game, name=g.players[g.turn];
  app.innerHTML=`<div class="stage">
    ${dots()}
    <div class="card"><span class="lbl">Telefonu ver</span><div class="who">${esc(name)}</div><span class="cat">Başkası bakmasın</span></div>
    <button class="btn" id="go">Ben ${esc(name)}</button>
    <button class="small" id="quit">Oyunu bitir</button></div>`;
  document.getElementById("go").onclick=()=>{S.screen="reveal";render()};
  document.getElementById("quit").onclick=()=>{S.screen="setup";render()};
}

function renderReveal(){
  const g=S.game, me=g.players[g.turn], isImp=g.imps.includes(g.turn), last=g.turn===g.players.length-1;
  const secret = isImp
    ? `<span class="lbl">${esc(me)}, sen</span><div class="word">KÖSTEBEK</div>
       ${S.hint?`<span class="lbl">İpucun</span><div class="word" style="font-size:clamp(26px,7vw,38px)">${esc(g.hint)}</div>`:`<span class="cat">İpucu yok, şansına</span>`}`
    : `<span class="lbl">${esc(me)}, gizli kelime</span><div class="word">${esc(g.word)}</div><span class="cat">${esc(g.cat)}</span>`;
  const idle = `<div class="finger" aria-hidden="true">☝️</div><div class="who" style="font-size:clamp(24px,6vw,34px)">${esc(me)}</div><span class="lbl">Görmek için basılı tut</span>`;
  app.innerHTML=`<div class="stage">
    ${dots()}
    <div class="card hold idle" id="hold" role="button" aria-label="Kelimeyi görmek için basılı tut">${idle}</div>
    <p class="sub" style="text-align:center;margin:0" id="tip">Parmağını kaldırınca kart kapanır.</p>
    <button class="small" id="nx" disabled>${last?"Herkes gördü, başla →":"Sıradaki: "+esc(g.players[g.turn+1])+" →"}</button></div>`;
  const hold=document.getElementById("hold"), nx=document.getElementById("nx");
  let shown=false;
  const show=e=>{e.preventDefault();if(shown)return;shown=true;hold.className="card hold"+(isImp?" imp":"");hold.innerHTML=secret;nx.disabled=false;
    try{hold.setPointerCapture(e.pointerId)}catch(_){}};
  const hide=()=>{if(!shown)return;shown=false;hold.className="card hold idle";hold.innerHTML=idle};
  hold.addEventListener("pointerdown",show);
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>hold.addEventListener(ev,hide));
  hold.addEventListener("contextmenu",e=>e.preventDefault());
  nx.onclick=()=>{g.turn++;S.screen=last?"talk":"pass";render()};
}

function renderTalk(){
  const g=S.game, n=g.players.length;
  const round=Math.floor(g.step/n)+1, seat=(g.starter+g.step)%n;
  const isLast=g.step===n*ROUNDS-1;
  app.innerHTML=`<div class="stage">
    <div class="round">TUR ${round} / ${ROUNDS}</div>
    <div class="card"><span class="lbl">${g.step===0?"İlk söyleyen":"Şimdi sıra"}</span><div class="who">${esc(g.players[seat])}</div>
      <span class="cat">Kelimeyle ilgili tek bir kelime söyle</span></div>
    <ul class="order">${[...Array(n)].map((_,k)=>{const s=(g.starter+k)%n;return `<li class="${s===seat?"now":""}">${esc(g.players[s])}</li>`}).join("")}</ul>
    <div class="stack">
      <button class="btn" id="nx">${isLast?"Turlar bitti, oylamaya geç":"Söyledi, sıradaki"}</button>
      <button class="small" id="skip">Hemen oylamaya geç</button>
    </div></div>`;
  document.getElementById("nx").onclick=()=>{if(isLast){S.screen="vote"}else g.step++;render()};
  document.getElementById("skip").onclick=()=>{S.screen="vote";render()};
}

function renderVote(){
  const g=S.game, top=Math.max(...g.votes), total=g.votes.reduce((a,b)=>a+b,0);
  app.innerHTML=`<div class="stage">
    <header><h1>Oylama</h1><p class="sub">Herkes köstebek sandığı kişiyi söylesin. Her oy için o ismin üstüne bir kez dokunun.</p></header>
    <div class="votes">${g.players.map((p,i)=>`<button class="vote ${top>0&&g.votes[i]===top?"top":""}" data-v="${i}"><span>${esc(p)}</span><b>${g.votes[i]}</b></button>`).join("")}</div>
    <div class="stack">
      <button class="btn red" id="show" ${total?"":"disabled"}>Köstebeği göster</button>
      <button class="small" id="reset" ${total?"":"disabled"}>Oyları sıfırla</button>
    </div></div>`;
  app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{g.votes[+b.dataset.v]++;render()});
  document.getElementById("reset").onclick=()=>{g.votes=g.votes.map(()=>0);render()};
  document.getElementById("show").onclick=()=>{S.screen="end";render()};
}

function renderEnd(){
  const g=S.game, names=g.imps.map(i=>g.players[i]);
  const top=Math.max(...g.votes), leaders=g.votes.map((v,i)=>v===top&&top>0?i:-1).filter(i=>i>=0);
  const caught=leaders.length===1&&g.imps.includes(leaders[0]);
  const verdict = top===0?"" : caught
    ? `<p class="verdict">Köstebek yakalandı! Son şans: kelimeyi doğru tahmin ederse yine kazanır.</p>`
    : leaders.length>1 ? `<p class="verdict">Oylar eşit, köstebek kaçtı!</p>` : `<p class="verdict">Yanlış kişi! Köstebek kazandı.</p>`;
  app.innerHTML=`<div class="stage">
    <div class="card imp"><span class="lbl">${names.length>1?"Köstebekler":"Köstebek"}</span><div class="word">${names.map(esc).join(" & ")}</div>
      <span class="lbl">Gizli kelime</span><div class="word" style="font-size:clamp(24px,7vw,36px)">${esc(g.word)}</div>
      ${S.hint?`<span class="cat">İpucu: ${esc(g.hint)}</span>`:""}</div>
    ${verdict}
    ${top>0?`<ul class="res">${g.players.map((p,i)=>({p,i,v:g.votes[i]})).sort((a,b)=>b.v-a.v).map(o=>`<li class="${g.imps.includes(o.i)?"bad":""}"><span>${esc(o.p)}</span><span>${o.v} oy</span></li>`).join("")}</ul>`:""}
    <div class="stack"><button class="btn" id="again">Yeni oyun</button>
    <button class="small" id="set">Oyuncuları değiştir</button></div></div>`;
  document.getElementById("again").onclick=startGame;
  document.getElementById("set").onclick=()=>{S.screen="setup";render()};
}

render();
</script>

</body>
</html>
